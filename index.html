<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FEED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>


<div class="top-bar">
  <div id="visit-counter" class="visit-counter admin-only" style="display:none;">👁️ <span id="visit-count">...</span></div>
  <button id="theme-toggle" class="btn-small">🌓 Toggle Theme</button>
  <button id="admin-login" class="btn-small">🔒 Admin Login</button>
  <button id="admin-stats" class="btn-small admin-only" style="display:none;">📊 Dashboard</button>
  <button id="admin-logout" class="btn-small" style="display:none;">🔓 Logout</button>
</div>
<header class="masthead">
  <div class="masthead-inner">
    <h1 id="site-title">THE FEED</h1>
    <p id="site-tagline">everything that happened, in one place</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <!-- tabs injected by app.js -->
</nav>

<main id="main">
  <!-- sections injected by app.js -->
</main>


<!-- Add-entry modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <h2 id="modal-title">Add to Vault</h2>
    <p class="modal-hint" id="modal-hint"></p>
    <form id="entry-form">
      <label>Title
        <input type="text" id="f-title" required maxlength="80">
      </label>
      <label>Details
        <textarea id="f-body" rows="3" maxlength="400"></textarea>
      </label>
      <label>Upload Media (Image/MP4 optional)
        <input type="file" id="f-file" accept="image/*,video/mp4">
      </label>

      <button type="submit" class="btn-primary">Generate entry code</button>
    </form>
    <div class="modal-output" id="modal-output" hidden>
      <p class="modal-hint">This browser can't save to the live site by itself — copy this into <code>data.js</code> and push it to GitHub so everyone sees it:</p>
      <textarea id="modal-code" readonly rows="8"></textarea>
      <button class="btn-secondary" id="copy-code">Copy</button>
    </div>
  </div>
</div>



<!-- Stats Modal -->
<div class="modal-backdrop" id="stats-modal-backdrop" style="display: none;">
  <div class="modal" style="max-width: 400px;">
    <button class="modal-close" id="stats-modal-close" aria-label="Close">&times;</button>
    <h2>Admin Dashboard</h2>
    <div id="stats-content" style="margin-top: 15px;">
      <p style="color: var(--text-soft);">Loading stats...</p>
    </div>
  </div>
</div>

<!-- Admin Login Modal -->
<div class="modal-backdrop" id="login-modal-backdrop" style="display: none;">
  <div class="modal" style="max-width: 300px;">
    <button class="modal-close" id="login-modal-close" aria-label="Close">&times;</button>
    <h2>Admin Login</h2>
    <p id="login-error" style="color:var(--tea); display:none; font-weight:bold; margin-bottom:10px;">Incorrect Password!</p>
    <form id="login-form">
      <label>Password
        <input type="password" id="login-password" required>
      </label>
      <button type="submit" class="btn-primary" style="margin-top:15px; width:100%;">Login</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="data.js"></script>

<script src="app.js?v=14"></script>
</body>
</html>
